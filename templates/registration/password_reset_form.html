{% extends "base.html" %}{% block title %}Reset your password{% endblock %}
{% block content %}
<div style="max-width:430px;margin:6vh auto">
  <div class="card" style="padding:26px">
    <h1 style="margin-bottom:2px">Reset your password</h1>
    <p class="sub">Enter the email address your account uses. If it matches an
      account, we'll send a link to choose a new password.</p>
    <form method="post">{% csrf_token %}
      <p><label for="id_email">Email address</label><br>
        <input id="id_email" name="email" type="email" autocomplete="email" autofocus required
               style="width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;font:inherit"></p>
      <button type="submit" class="btn btn-primary" style="width:100%">Send the link</button>
    </form>
    <p class="muted" style="font-size:13px;margin-bottom:0;margin-top:16px">
      <a href="{% url 'login' %}">Back to sign in</a>
    </p>
  </div>
</div>
{% endblock %}
